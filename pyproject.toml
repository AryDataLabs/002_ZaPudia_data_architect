[build-system]
requires        = ["setuptools>=68.0", "wheel>=0.41"]
build-backend   = "setuptools.build_meta"

[project]
name            = "zapudia-data-architect"
version         = "0.1.1"
description     = "Production-ready e-commerce recommendation system dataset pipeline"
readme          = "README.md"
license         = {text = "GNU-3.0"}
requires-python = ">=3.10"
authors         = [{name  = "Aryanto, M.Si", 
                    email = "aryanto.dandan@gmail.com"}]
maintainers     = [{name  = "Aryanto, M.Si", 
                    email = "aryanto.dandan@gmail.com"}]
keywords        = ["recommendation-system",
                   "data-pipeline",
                   "e-commerce",
                   "polars",
                   "dataset-generation",
                   "noise-injection",]
classifiers     = ["Development Status :: 4 - Beta",
                   "Intended Audience :: Developers",
                   "Intended Audience :: Science/Research",
                   "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
                   "Operating System :: OS Independent",
                   "Programming Language :: Python :: 3",
                   "Programming Language :: Python :: 3.10",
                   "Programming Language :: Python :: 3.11",
                   "Programming Language :: Python :: 3.12",
                   "Programming Language :: Python :: 3.13",
                   "Programming Language :: Python :: 3.14",
                   "Programming Language :: Python :: 3.15",
                   "Topic :: Scientific/Engineering :: Artificial Intelligence",
                   "Topic :: Software Development :: Libraries :: Python Modules",
                   "Typing :: Typed",]
dependencies    = ["polars>=0.18.0",
                   "pyyaml>=6.0",
                   "joblib>=1.3.0",
                   "litestar>=2.0.0",
                   "uvicorn[standard]>=0.23.0",
                   "gunicorn>=21.2.0",
                   "python-dotenv>=1.0.0",
                   "orjson>=3.9.0",
                   "uvloop>=0.17.0; sys_platform != 'win32'",]

[project.optional-dependencies]
dev             = ["pytest>=7.4.0",
                   "pytest-asyncio>=0.21.0",
                   "httpx>=0.24.0",
                   "black>=23.0.0",
                   "ruff>=0.0.280",
                   "build>=1.0.0",
                   "twine>=4.0.0",]

[project.urls]
Homepage          = "https://arydatalabs.pages.dev/blog/zapudia03-data-creation-engineering/"
Repository        = "https://github.com/AryDataLabs/002_ZaPudia_data_architect"
Issues            = "https://github.com/AryDataLabs/002_ZaPudia_data_architect/issues"

[project.scripts]
zapudia-pipeline  = "pipeline.orchestrator:main"
zapudia-api       = "api.api_server:main"

[tool.black]
line-length     = 100
target-version  = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length     = 100
target-version  = "py310"

[tool.ruff.lint]
select          = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths       = ["test"]
python_files    = ["*_test.py", "*Test.py", "test_*.py"]
python_classes  = ["*Test", "*Tests"]
asyncio_mode    = "auto"

[tool.setuptools.package-dir]
""              = "src"

[tool.setuptools.packages.find]
where           = ["src"]
include         = ["pipeline*", "extractors*", "transformers*", "noise*", "api*", "configs*"]

[tool.setuptools.package-data]
"*" = ["*.so", "*.pyd", "*.pxd", "*.pyx", 
       "*.ini", "*.sql", "*.jpg", "*.ico", 
       "*.zip", "*.js", "*.css", "*.j2", 
       "*.sh", "*.md", "*.html"]
