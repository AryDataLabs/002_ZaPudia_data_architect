# data_pipeline/configs/pipeconf.yaml
# Single source of truth for the Ultimate ZaPudia Unified Dataset build.
# Deterministic given seed.

pipeline:
  name              : "ZaPudia_unified_dataset"
  version           : "2.1.0"
  seed              : 20260831
  output_dir        : "data/processed"
  intermediate_dir  : "data/intermediate"
  partition_count   : 16

sources:
  kaggle_behavior:
    path            : "data/raw/kaggle_behavior/*.parquet"
    event_type_map  :
      view          : "view"
      cart          : "cart"
      remove_from_cart: "remove"
      purchase      : "purchase"

  kaggle_orders:
    # Order/LTV sources: dhairyajeetsingh, bytadit, anvitkumar, ayushparwal
    path            : "data/raw/kaggle_orders/*.parquet"

  ga4_bigquery:
    path            : "data/raw/ga4_simulated/*.parquet"
    event_name_map  :
      page_view     : "view"
      select_item   : "view"
      add_to_cart   : "cart"
      begin_checkout: "checkout"
      purchase      : "purchase"

implicit_weights:
  view              : 1.0
  cart              : 3.0
  buy               : 5.0
  dwell             : 0.5

implicit_normalization:
  min_rating        : 1.0
  max_rating        : 5.0
  alpha_confidence  : 40.0     # iALS confidence scaling (Hu-Koren-Volinsky default)

noise:
  telemetry_drop_rate     : 0.08  # §2.1
  bot_fraction            : 0.05  # §2.2 — bot volume as fraction of human volume
  bot_lambda_per_sec      : 150.0 # §2.2 — inter-arrival rate (mean ~6.7ms)
  bot_interarrival_min_ms : 1
  bot_interarrival_max_ms : 10
  oo_lambda_per_sec       : 0.5   # §2.3 — out-of-order jitter (mean 2s)
  schema_null_rate        : 0.25  # §2.4
  cold_start_rate         : 0.15  # §2.5

split:
  test_fraction           : 0.15
  split_by                : "user" # user-level holdout (no leakage)
  min_user_interactions   : 5      # users with < 5 interactions excluded from test

session:
  gap_minutes       : 30 # session boundary gap (true_event_time)

logging:
  log_file          : "zapudia_pipeline.log"
  level             : "WARNING"

geo_provinces:
  - "ID-JK"   # Jakarta
  - "ID-JB"   # West Java
  - "ID-JT"   # Central Java
  - "ID-JI"   # East Java
  - "ID-PA"   # Papua
  - "ID-SN"   # South Sulawesi
  - "ID-SU"   # North Sumatra
  - "ID-KI"   # West Kalimantan

categories:
  electronics:
    - "electronics.smartphone"
    - "electronics.audio.headphone"
    - "electronics.video.tv"
    - "electronics.computer.laptop"
  fashion:
    - "fashion.clothing.shirt"
    - "fashion.shoes"
    - "fashion.bag"
  fmcg:
    - "fmcg.food.snack"
    - "fmcg.beverage.coffee"
    - "fmcg.household.detergent"
  automotive:
    - "automotive.motorcycle.helmet"
    - "automotive.oil"
    - "automotive.tire"
