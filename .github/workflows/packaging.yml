name: Build Wheel Distribution

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          # Test on Windows and macOS for key versions
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Verify wheel metadata
        run: uvx twine check dist/*

      - name: Display wheel contents
        run: |
          python -c "
          import zipfile, glob, sys
          wheels = glob.glob('dist/*.whl')
          if not wheels:
              print('No wheel found!'); sys.exit(1)
          for w in wheels:
              print(f'=== {w} ===')
              with zipfile.ZipFile(w) as zf:
                  for name in sorted(zf.namelist()):
                      print(f'  {name}')
          "

      - name: Install wheel and import test
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' || matrix.python-version == '3.15' }}
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          uv pip install --system --reinstall --prerelease=allow dist/*.whl
          python -c "import zapudataset; from zapudataset import pipeline, extractors, transformers, noise, configs; zapudataset.get_api()"
          echo "All packages imported successfully"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapudia-wheel-py${{ matrix.python-version }}-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 30
          if-no-files-found: error

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapudia-sdist-py${{ matrix.python-version }}-${{ matrix.os }}
          path: dist/*.tar.gz
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # 1. Download semua artifact wheel matrix tanpa merge
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_artifacts
          pattern: zapudia-wheel-*

      # 2. Download artifact sdist (.tar.gz)
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          path: dist_artifacts
          pattern: zapudia-sdist-py3.12-ubuntu-latest

      # 3. Rename dan susun wheel per versi Python & OS ke folder dist
      - name: Organize and rename wheels per Python version
        shell: bash
        run: |
          mkdir -p dist
          
          # Rename wheel agar unik berdasarkan matriks versi Python & OS
          for dir in dist_artifacts/zapudia-wheel-*; do
            if [ -d "$dir" ]; then
              matrix_tag="${dir#dist_artifacts/zapudia-wheel-}"
              for file in "$dir"/*.whl; do
                if [ -f "$file" ]; then
                  base_name=$(basename "$file" .whl)
                  cp "$file" "dist/${base_name}-${matrix_tag}.whl"
                fi
              done
            fi
          done

          # Salin file sdist tarball (.tar.gz)
          for file in dist_artifacts/zapudia-sdist-*/*.tar.gz; do
            if [ -f "$file" ]; then
              cp "$file" dist/
            fi
          done

      - name: Display release assets
        run: ls -la dist/

      # 4. Unggah seluruh wheel per versi Python & sdist ke GitHub Release
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}